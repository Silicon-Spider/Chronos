<polygon points="530,624 524.5,613.0 535.5,613.0" fill="#c4c2b8"/>
<path d="M 682 410 L 682 624" fill="none" stroke="#c4c2b8" stroke-width="2"/>
<polygon points="682,624 676.5,613.0 687.5,613.0" fill="#c4c2b8"/>
<path d="M 1100 410 L 1100 624" fill="none" stroke="#c4c2b8" stroke-width="2"/>
<polygon points="1100,624 1094.5,613.0 1105.5,613.0" fill="#c4c2b8"/>
<path d="M 266 722 L 266 780" fill="none" stroke="#c4c2b8" stroke-width="2"/>
<polygon points="266,780 260.5,769.0 271.5,769.0" fill="#c4c2b8"/>
<path d="M 890 722 L 890 780" fill="none" stroke="#c4c2b8" stroke-width="2"/>
<polygon points="890,780 884.5,769.0 895.5,769.0" fill="#c4c2b8"/>
<path d="M 890 878 L 890 936" fill="none" stroke="#c4c2b8" stroke-width="2"/>
<polygon points="890,936 884.5,925.0 895.5,925.0" fill="#c4c2b8"/>
<path d="M 72 361 L 36 361 L 36 999 L 72 999" fill="none" stroke="#c4c2b8" stroke-width="2"/>
<polygon points="72,999 61.0,1004.5 61.0,993.5" fill="#c4c2b8"/>
<path d="M 266 1062 L 266 1120" fill="none" stroke="#c4c2b8" stroke-width="2"/>
<polygon points="266,1120 260.5,1109.0 271.5,1109.0" fill="#c4c2b8"/>
